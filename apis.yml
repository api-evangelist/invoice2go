aid: invoice2go
name: Invoice2go
description: 'Invoice2go (part of BILL) is a mobile-first invoicing and small-business
  management platform for freelancers, contractors, and self-employed professionals.
  It lets users create and send professional invoices and estimates, accept online
  payments via bank transfer, credit and debit card, and PayPal, track expenses and
  billable time, capture customer reviews, and view business reports across web, iOS,
  and Android. Serving roughly 225,000 small-business users, Invoice2go focuses on
  getting paid faster and simplifying back-office admin. It was acquired by BILL in
  2021. There is no live public developer API; third-party integrations are delivered
  through an Apideck-powered integrations marketplace (QuickBooks, Xero, MYOB, HubSpot,
  Shopify, Zapier, and more).'
